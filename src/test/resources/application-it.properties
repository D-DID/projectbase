# 10/31 — 통합 테스트(ApiIntegrationTest, @ActiveProfiles("it")) 전용 설정.
# 메모리 DB(H2, MySQL 호환 모드)로 엔티티에서 테이블을 만든다. 실제 MySQL·외부 API 를 건드리지 않는다.
# 여기에는 실제 키·비밀번호를 쓰지 않는다 — JWT 서명 키는 테스트가 실행할 때마다 무작위로 만든다(@DynamicPropertySource).
spring.datasource.url=jdbc:h2:mem:underfaker-it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false

jwt.expiration_time=3600000

# 외부 API — 닿지 않는 주소로 둔다(KC 조회는 실패해도 판정은 계속된다 · KcLookupService)
openapi.safety-korea.base-url=http://127.0.0.1:9
openapi.safety-korea.auth-key=
openapi.safety-korea.recall-list-path=/api/recall/recallList.do
openapi.safety-korea.recall-detail-path=/api/recall/recallDetail.do
openapi.safety-korea.cert-list-path=/api/cert/certificationList.do
openapi.safety-korea.cert-detail-path=/api/cert/certificationDetail.do
openapi.safety-korea.recall-publish-date=20260916
openapi.safety-korea.recall-sync-max=0

# Google Vision — 키 없음(사진 판독 비활성 → V006)
google.vision.url=https://vision.googleapis.com/v1/images:annotate
google.vision.api-key=
google.vision.credentials-path=
ocr.budget.clova-limit=0
ocr.budget.vision-limit=0
